<!DOCTYPE html>
<html>
<head>
  <title>jQuery Test</title>
  <!-- ✅ jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <h1>Hello from Jekyll + jQuery!</h1>
  <button id="btn">Click me</button>
  <p id="message"></p>

  <script>
    $('#btn').on('click', function () {
      $('#message').text('🧡 jQuery works on GitHub Pages!');
    });
  </script>
</body>
</html>
