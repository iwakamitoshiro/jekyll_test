<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello Jekyll with jQuery</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <h1>Hello Friendy + jQuery!</h1>
  <button id="hello">Click Me</button>
  <p id="message"></p>

  <script>
    $('#hello').on('click', () => {
      $('#message').text('? jQuery is working on GitHub Pages!');
    });
  </script>
</body>
</html>
